<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 40px; background-color: #f9f9f9; }
        form { background: white; padding: 20px; border-radius: 5px; width: 300px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Edit Book</h2>
    <form method="POST">
        <label>Title:</label>
        <input type="text" name="title" value="{{ book.title }}" required>
        
        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ book.price }}" required>
        
        <label>Author:</label>
        <select name="author_id" required>
            {% for author in authors %}
            <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>{{ author.name }} (ID: {{ author.author_id }})</option>
            {% endfor %}
        </select>
        
        <button type="submit">Update</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>
}
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
