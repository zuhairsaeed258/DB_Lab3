<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Author</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 40px; background-color: #f9f9f9; }
        form { background: white; padding: 20px; border-radius: 5px; width: 300px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Add New Author</h2>
    <form method="POST">
        <label>Author ID:</label>
        <input type="number" name="author_id" required>
        
        <label>Name:</label>
        <input type="text" name="name" required>
        
        <label>Country:</label>
        <input type="text" name="country">
        
        <button type="submit">Save</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
